<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <title>Login</title>
  </head>
  <body>
    <nav class="navbar dark p-3 bg-primary shadow-lg">
        <div class="container-fluid">
          <a class="navbar-brand">Navbar</a>
          <form class="d-flex" placeholder="Search" type="Search" role="Search">
           <!----<input class="form-control me-2" placeholder="Search" aria-label="Search">-->
           {% if request.user.is_authenticated %}
            <a href="/logout/" class="btn btn-success" type="submit">Login</a>
            {% else %}
            <a href="/login/" class="btn btn-success" type="submit">Login</a>
            {% endif %}
        </form>
        </div>
      </nav>
 
   

    <div class="container my-4">
     <h1 class="text-center">Login to our website</h1>
     <form action="" method="post" class="col-6 mx-auto card p-3 shadow-lg">
        {% csrf_token %}
        {% if messages %}
        <div class="alert alert-primary" role="alert">
            {% for message in messages %}
                {{ message }}<br>
            {% endfor %}
        </div>
    {% endif %}
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input  name="username"   type="text" class="form-control" >
            
        </div>
        <div class="form-group">
            <label for="password">password</label>
            <input  name="password"   class="form-control" > 
   
        </div>
        <p>Don't have account <a href="/register/" >Register</a></p>
        
       
         
        <button type="submit" class="btn btn-success">Login</button>
     </form>
    
    
    </div>
</body>
</html>
