<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <title>Login</title>
  </head>
  <body>
    <nav class="navbar dark p-3 bg-danger shadow-lg">
      <div class="container-fluid">
        <a class="navbar-brand">Navbar</a>
        <form class="d-flex" placeholder="Search" type="Search" role="Search">
          <!--<input class="form-control me-2" placeholder="Search" aria-label="Search">-->
         {% if request.user.is_authenticated %}
          <a href="/logout/" class="btn btn-success" type="submit">Lougout</a>
          {% else %}
          <a href="/login/" class="btn btn-success" type="submit">Login</a>
          {% endif %}
      </form>
      </div>
    </nav>
 
   

    <div class="container my-4">
     <h1 class="text-center">Receipe</h1>
     <form action="" method="post" class="col-6 mx-auto card p-3 shadow-lg">
        {% csrf_token %}
        <div class="form-group">
            <label for="receipe_name" class="form-label">Receipe name</label>
            <input  name="receipe_name" type="text" class="form-control" >
            
        </div>
        <div class="form-group">
            <label for="receipe_description">Receipe description</label>
   
            <textarea  name="receipe_description"  class="form-control"></textarea>
        </div>
        
       
         
        <button type="submit" class="btn btn-success">Add Receipe</button>
     </form>
    <!---- {{receipes}}-->
     <table class="table">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Receipe name</th>
          <th scope="col">Receipe description</th>
          <th scope="col">Actions</th>
        

        </tr>
      </thead>
      <tbody>
        {% for receipe in receipes %}
        <tr>
          <th scope="row">{{ forloop.counter}}</th>
          <td>{{receipe.receipe_name}}</td>
          
          <td>{{receipe.receipe_description}}</td>
      
            <td>
              <a href="/delete_receipe/{{receipe.id}}/" class="btn btn-danger">Delete</a>
              <a href="/update_receipe/{{receipe.id}}/" class="btn btn-success">update</a>
          </td>
          
         
        </tr>
        {% endfor %}
      </tbody>
     </table>
    
    </div>
</body>
</html>
